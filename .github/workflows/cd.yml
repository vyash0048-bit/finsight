name: FinSight CD

on:
  workflow_run:
    workflows: ["FinSight CI"]
    types:
      - completed
    branches:
      - master

jobs:
  build-and-push:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/finsight-backend:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/finsight-backend:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Deployment Webhook
        run: |
          if [ -n "${{ secrets.DEPLOY_WEBHOOK_URL }}" ]; then
            curl -X POST -d "sha=${{ github.sha }}" "${{ secrets.DEPLOY_WEBHOOK_URL }}"
            echo "Deployment triggered."
          else
            echo "No DEPLOY_WEBHOOK_URL configured. Skipping automatic deployment."
          fi
