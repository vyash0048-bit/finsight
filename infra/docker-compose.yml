services:
  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    entrypoint: ""
    command: sh -c 'alembic upgrade head 2>&1 || echo "Migration skipped"; exec uvicorn app.main:app --host 0.0.0.0 --port 8000'
    ports:
      - "8000:8000"
    volumes:
      - ../backend:/app
    env_file:
      - ../.env
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
    dns:
      - 8.8.8.8
    environment:
      - ENV=development
      - DATABASE_URL=postgresql://finsight_user:finsight_pass@postgres:5432/finsight_db
      - MONGO_URL=mongodb://mongo:27017
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: finsight_user
      POSTGRES_PASSWORD: finsight_pass
      POSTGRES_DB: finsight_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finsight_user -d finsight_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:6.0
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    ports:
      - "8501:8080"
    volumes:
      - ../frontend:/app
    depends_on:
      - api
    environment:
      - API_HOST=localhost:8000
    restart: unless-stopped

volumes:
  postgres_data:
  mongo_data:

networks:
  default:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: 1200

