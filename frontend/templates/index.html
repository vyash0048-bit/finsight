<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinSight | Real-Time Swarm Research</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=2">
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        // Pass API URL to external JS
        window.API_URL = "{{ api_url }}";
    </script>
</head>
<body>
    <div class="background-mesh"></div>
    <main class="container">
        <header class="app-header">
            <h1 class="gradient-text">📊 Real-Time Swarm Research</h1>
            <p class="subtitle">AI-Powered Financial Insights</p>
        </header>

        <section class="search-section glass-panel">
            <form id="research-form" class="search-box">
                <input type="text" id="ticker-input" placeholder="Enter Ticker Symbol (e.g. AAPL, TSLA)" required autocomplete="off" />
                <button type="submit" id="generate-btn" class="btn-primary">
                    <span class="btn-text">🚀 Generate AI Report</span>
                </button>
            </form>
            <div id="loading-state" class="hidden">
                <div class="spinner"></div>
                <p id="loading-text">Swarm is actively analyzing... This may take 1-2 minutes (especially if waking from sleep).</p>
            </div>
            <div id="error-message" class="hidden alert-error"></div>
        </section>

        <section id="results-section" class="hidden">
            <div class="glass-panel results-container">
                <h2 id="report-title">🏆 Final Report</h2>
                
                <div class="recommendation-banner" id="recommendation-banner">
                    <h3>Recommendation: <span id="recommendation-value">UNKNOWN</span></h3>
                </div>

                <div class="report-content">
                    <div class="content-block">
                        <h4>Executive Summary</h4>
                        <p id="executive-summary"></p>
                    </div>

                    <div class="content-block">
                        <h4>Key Drivers</h4>
                        <ul id="key-drivers-list"></ul>
                    </div>
                </div>

                <div class="divider"></div>

                <h3>🤖 Swarm Agent Breakdowns</h3>
                <div class="agents-grid" id="agents-grid">
                    <!-- Agent cards will be dynamically inserted here -->
                </div>
            </div>
        </section>
    </main>

    <script src="{{ url_for('static', filename='js/main.js') }}?v=2"></script>
</body>
</html>
