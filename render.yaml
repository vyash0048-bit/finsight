# Render Blueprint — Free Tier Deployment
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: finsight-api
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: finsight-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: finsight-redis
          type: redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: MONGO_URL
        sync: false  # Set manually in Render dashboard (MongoDB Atlas free cluster)
      - key: GEMINI_API_KEY
        sync: false  # Set manually in Render dashboard
      - key: CHROMA_PATH
        value: /tmp/chroma
      - key: PYTHONPATH
        value: /app

  - type: web
    name: finsight-frontend
    runtime: docker
    dockerContext: ./frontend
    dockerfilePath: ./frontend/Dockerfile
    plan: free
    envVars:
      - key: API_HOST
        fromService:
          name: finsight-api
          type: web
          property: host

  - type: redis
    name: finsight-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []  # Only internal access

databases:
  - name: finsight-db
    plan: free
    databaseName: finsight
    user: finsight
